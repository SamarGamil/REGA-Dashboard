# This file is used to take project/repository specific metadata e.g. Nexus IQ, ACS Scanning
name: pipeline-ci
version: 1.0.0
scanners:
  nexusiq:
    enabled: true
    dockerimage: docker-public/dotnet/sdk:10.0
    buildcommand: dotnet build -c Release -o /src/publish
    scantarget: "*.*"
    targetdir: publish
  acs:
    enabled: true
  coverity:
    enabled: true
    dockerimage: docker-public/dotnet/sdk:10.0
    buildcommand: dotnet restore && dotnet build -c Release --no-restore
