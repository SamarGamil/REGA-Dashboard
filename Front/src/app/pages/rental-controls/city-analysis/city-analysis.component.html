<app-layout
  title="تحليل المدينة"
  subtitle="تحليل تفصيلي لمؤشرات الضوابط الإيجارية على مستوى المدينة."
  [breadcrumbs]="[{ label: 'مؤشرات الإيجار' }, { label: 'تحليل المدينة' }]"
  [showGlobalFilter]="false"
  [showPageHeader]="false"
>
  @if (data(); as d) {
    <div class="relative">
      @if (loading()) {
        <div class="absolute inset-0 z-40 flex items-start justify-center bg-white/60 backdrop-blur-[1px] rounded-xl pt-24">
          <div class="flex items-center gap-2 px-4 py-2 bg-white rounded-full shadow-md border border-[#E7ECF2]">
            <i class="ri-loader-4-line text-[#00848D] text-lg animate-spin"></i>
            <span class="text-sm font-medium text-[#0F172A]">جارٍ تحميل بيانات المدينة…</span>
          </div>
        </div>
      }

      <app-city-analysis-header [data]="d" [cities]="cities()" (cityChange)="handleCityChange($event)" />

      <div class="mb-5">
        <app-period-filter labeled />
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-10 gap-4 mb-5">
        <div class="lg:col-span-7"><app-executive-summary [data]="d" /></div>
        <div class="lg:col-span-3"><app-media-monitoring [data]="d" /></div>
      </div>

      <app-kpi-cards [kpis]="d.kpis" />

      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4 mb-5">
        <div class="lg:col-span-3"><app-market-movement [data]="d.marketMovementTable" /></div>
        <div class="lg:col-span-2"><app-rental-indicator-charts [charts]="d.rentalIndicatorCharts" /></div>
      </div>

      <app-market-analysis-tabs [tabs]="d.marketAnalysisTabs" />

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-5">
        <app-what-to-monitor [items]="d.whatToMonitor" />
        <app-executive-recommendations [recommendations]="d.recommendations" />
      </div>

      <app-city-journey [stages]="d.cityJourney" />
    </div>
  } @else if (loading()) {
    <div class="flex flex-col items-center justify-center py-32 gap-3">
      <i class="ri-loader-4-line text-[#00848D] text-4xl animate-spin"></i>
      <span class="text-sm font-medium text-[#4B5563]">جارٍ تحميل بيانات المدينة…</span>
    </div>
  }
</app-layout>
