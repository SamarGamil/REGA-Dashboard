<app-layout
  title="حالة المدن للضوابط الإيجارية"
  subtitle="نظرة تنفيذية على حالة المدن للضوابط الإيجارية وأولويات التدخل"
  [breadcrumbs]="[{ label: 'مؤشرات الإيجار' }, { label: 'حالة المدن للضوابط الإيجارية' }]"
  [showGlobalFilter]="false"
  [portalPeriod]="true"
>
  @if (overview(); as data) {
    <div class="mb-6">
      <app-filter-bar
        [cities]="cities()"
        [selectedStatus]="selectedStatus()"
        [selectedClassification]="selectedClassification()"
        [selectedCity]="selectedCity()"
        (statusChange)="selectedStatus.set($event)"
        (classificationChange)="selectedClassification.set($event)"
        (cityChange)="selectedCity.set($event)"
        (reset)="handleReset()"
      />
    </div>

    <div class="mb-6">
      <app-summary-collapsible
        [summaryData]="data.nationalSummary"
        [operationalStages]="data.operationalStages"
        [cities]="data.cities"
      />
    </div>

    <div class="mb-10">
      <app-city-card-grid [cities]="filteredCities()" [periodLabel]="periodLabel()" />
      @if (filteredCities().length === 0) {
        <div class="text-center py-12 rounded-[20px] border border-[#E7ECF2] bg-white mt-4"
          style="box-shadow: 0 1px 3px rgba(0,47,86,0.04), 0 8px 24px rgba(0,47,86,0.04)">
          <p class="text-[#4B5563] text-sm">لا توجد مدن تطابق معايير الفلترة الحالية</p>
          <button (click)="handleReset()" class="mt-3 text-[#00848D] text-sm font-bold hover:text-[#005257] cursor-pointer transition-colors duration-200">إعادة ضبط الفلاتر</button>
        </div>
      }
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-6">
      <app-impact-panel
        [cityName]="impact().name"
        [available]="impact().available"
        [beforeValue]="impact().beforeValue"
        [afterValue]="impact().afterValue"
        [previousValue]="impact().previousValue"
        [increasePoints]="increasePoints()"
      />
      <app-recommendation-panel [recommendations]="recommendations()" [periodLabel]="periodLabel()" />
    </div>
  }
</app-layout>
