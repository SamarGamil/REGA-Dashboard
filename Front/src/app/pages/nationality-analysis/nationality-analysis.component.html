<app-layout title="تحليل الجنسيات" subtitle="تركيبة المشترين الأجانب وزخمهم وقدرتهم الشرائية" [breadcrumbs]="[{ label: 'تملك الأجانب' }, { label: 'تحليل الجنسيات' }]">


  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
    <app-chart-card title="أعلى الجنسيات حسب عدد العمليات" subtitle="ترتيب تنازلي">
      @if (hasData) { <div echarts [options]="txChartOptions" class="w-full h-[340px]"></div> }
      @else { <app-chart-empty-state height="340px" /> }
    </app-chart-card>
    <app-chart-card title="أعلى الجنسيات حسب القيمة" subtitle="إجمالي قيمة الصفقات (ر.س)">
      @if (hasData && hasValueData) { <div echarts [options]="valueChartOptions" class="w-full h-[340px]"></div> }
      @else { <app-chart-empty-state height="340px" message="لا توجد قيم صفقات للعرض" /> }
    </app-chart-card>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <app-chart-card title="متوسط قيمة الصفقة لكل جنسية" subtitle="ر.س">
      @if (hasData && hasValueData) { <div echarts [options]="avgValueOptions" class="w-full h-[300px]"></div> }
      @else { <app-chart-empty-state height="300px" message="لا توجد قيم صفقات للعرض" /> }
    </app-chart-card>
    <app-chart-card title="الحصة السوقية بحسب الجنسية" subtitle="نسبة مئوية من إجمالي العمليات">
      @if (hasData) {
      <div class="space-y-3">
        <div *ngFor="let n of top10Nationalities" class="flex items-center gap-3">
          <span class="text-xs text-foreground-700 w-14 truncate">{{ n.name }}</span>
          <div class="flex-1 h-7 bg-background-100 rounded-full overflow-hidden">
            <div class="h-full bg-accent-500 rounded-full flex items-center px-3 transition-all duration-500" [style.width.%]="n.marketShare * 2.5">
              <span class="text-xs font-bold text-white">{{ n.marketShare }}%</span>
            </div>
          </div>
          <span class="text-xs text-foreground-500 w-20 text-left whitespace-nowrap">{{ formatCount(n.transactions) }} عملية</span>
        </div>
      </div>
      } @else { <app-chart-empty-state height="300px" /> }
    </app-chart-card>
  </div>
</app-layout>
